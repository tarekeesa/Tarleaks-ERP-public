# Issue forms for the public repository. Blank issues are off: every report uses
# one of the forms, so it arrives with the version and the steps it needs.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability (private)
    url: https://github.com/tarekeesa/Tarleaks-ERP/security/advisories/new
    about: Never in a public issue. Use private vulnerability reporting, or e-mail dev@tarleaks.com (see SECURITY.md).
  - name: Licence keys, trials, pricing and sales
    url: https://tarleaks.com
    about: Questions about a licence or trial key go to info@tarleaks.com, not to an issue.
