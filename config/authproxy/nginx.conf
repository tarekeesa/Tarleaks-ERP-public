# Keep-alive proxy for the gateway's sign-in check (QA-PERF-04).
#
# WHY: Traefik asks the auth service about EVERY signed-in request
# (/internal/authorize), and its client keeps only two idle connections, so
# under load nearly every call opened a new TCP connection and the gateway ran
# out of local ports (500/502 above about ten people at once). The hosted
# platform runs the same fix as a sidecar.
# Here it is its own small container: the gateway asks it at authproxy:8099, and
# it keeps a pool of open connections to auth:8001.
#
# Only /internal/authorize is passed on. Nothing else of auth is reachable
# through this proxy, and the proxy itself is not published outside Docker.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 8192; }
http {
  access_log off;
  client_body_temp_path /tmp/cb;
  proxy_temp_path /tmp/pt;
  fastcgi_temp_path /tmp/ft;
  uwsgi_temp_path /tmp/ut;
  scgi_temp_path /tmp/st;

  # Docker's own name server: the address of `auth` is looked up again every
  # few seconds, so recreating the auth container (an upgrade) needs no restart
  # of this proxy. `resolve` needs nginx 1.27.3 or newer (the image is 1.30).
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream auth_keepalive {
    zone auth_keepalive 64k;
    server auth:8001 resolve;
    keepalive 512;
    keepalive_requests 1000000;
    keepalive_timeout 300s;
  }

  server {
    listen 8099 backlog=8192;
    keepalive_requests 1000000;
    keepalive_timeout 300s;
    large_client_header_buffers 8 64k;

    location = /authproxy-health { return 200 "ok"; }

    location = /internal/authorize {
      proxy_pass http://auth_keepalive;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      # The answer carries the whole permission list in headers (tens of KB).
      proxy_buffer_size 128k;
      proxy_buffers 8 128k;
      proxy_busy_buffers_size 256k;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      # The check is a GET without a body: do not send or wait for one.
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    location / { return 404; }
  }
}
