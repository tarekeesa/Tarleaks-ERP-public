# TARLEAKS_TLS=letsencrypt — the gateway serves HTTPS itself with a free
# Let's Encrypt certificate, proven over port 80 (HTTP-01). For ONE name:
# TARLEAKS_HOST. Companies on subdomains (<company>.<host>) need a wildcard
# certificate: TARLEAKS_TLS=cloudflare (compose.https-cloudflare.yml).
#
# Added to COMPOSE_FILE by ./install.sh --profile-env production and by
# ./tarleaks https (never by hand). Port 80 stays open and sends every visitor
# to https://; certificates renew by themselves 30 days before they end and
# are kept in the `certs` volume. docs/https.md
#
# `command` REPLACES the base list, so it repeats it first:
# scripts/check-https.sh (CI) fails when the two drift apart.
services:
  gateway:
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=300s
      - --entrypoints.web.transport.respondingTimeouts.writeTimeout=300s
      - --ping=true
      - --log.level=${GATEWAY_LOG_LEVEL:-WARN}
      - --accesslog=${GATEWAY_ACCESS_LOG:-false}
      - --api.dashboard=false
      # No calls home: no version check, no anonymous usage statistics.
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      # ---- HTTPS (this file) ----
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=300s
      - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=300s
      - --entrypoints.websecure.http.middlewares=hsts@file
      - --entrypoints.websecure.http.tls.certresolver=le
      - --entrypoints.websecure.http.tls.domains[0].main=${TARLEAKS_HOST:?TARLEAKS_HOST is not set}
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL is not set - the address Let's Encrypt writes to before a certificate ends}
      - --certificatesresolvers.le.acme.storage=/certs/acme.json
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:-tarleaks-files}
      # A private test CA (docs/https.md, "Test it with a local CA"); empty = the public ones.
      LEGO_CA_CERTIFICATES: ${ACME_CA_CERTIFICATES:-}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
      - certs:/certs

volumes:
  certs:
