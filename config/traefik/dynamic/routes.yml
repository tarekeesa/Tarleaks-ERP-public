    fleet:
      rule: "PathPrefix(`/api/fleet`)"
      service: fleet
      priority: 10
      middlewares: [strip-identity, license-check, security-headers]
    correspondence:
      rule: "PathPrefix(`/api/correspondence`)"
      service: correspondence
      priority: 10
      middlewares: [strip-identity, license-check, security-headers]
    parties:
      rule: "PathPrefix(`/api/parties`)"
      service: parties
      priority: 10
      middlewares: [strip-identity, license-check, security-headers]
    insights:
      rule: "PathPrefix(`/api/insights`)"
      service: insights
      priority: 10
      middlewares: [strip-identity, license-check, security-headers]
    chat:
      rule: "PathPrefix(`/api/chat`)"
      service: chat
      priority: 10
      middlewares: [strip-identity, license-check, security-headers]
    ecommerce:
      rule: "PathPrefix(`/api/ecommerce`)"
      service: ecommerce
      priority: 10
      middlewares: [strip-identity, license-check, security-headers]
    pos:
      rule: "PathPrefix(`/api/pos`)"
      service: pos
      priority: 10
      middlewares: [strip-identity, license-check, security-headers]
    rental:
      rule: "PathPrefix(`/api/rental`)"
      service: rental
      priority: 10
      middlewares: [strip-identity, license-check, security-headers]
    procurement:
      rule: "PathPrefix(`/api/procurement`)"
      service: procurement
      priority: 10
      middlewares: [strip-identity, license-check, security-headers]
    construction:
      rule: "PathPrefix(`/api/construction`)"
      service: construction
      priority: 10
      middlewares: [strip-identity, license-check, security-headers]
    contracts:
      rule: "PathPrefix(`/api/contracts`)"
      service: contracts
      priority: 10
      middlewares: [strip-identity, license-check, security-headers]
    subscriptions:
      rule: "PathPrefix(`/api/subscriptions`)"
      service: subscriptions
      priority: 10
      middlewares: [strip-identity, license-check, security-headers]
    iso42001:
      rule: "PathPrefix(`/api/iso42001`)"
      service: iso42001
      priority: 10
      middlewares: [strip-identity, license-check, security-headers]
    auth-public:
      # Exact paths: anything else under /api/auth is signed in (license-check
      # sets the workspace headers). SSO and SAML: only start and callback are
      # public; their settings (/sso/config, /saml/config) need the admin.
      # The mobile-app and security-reset paths exist from release 1.2.0.
      rule: "Path(`/api/auth/login`) || PathPrefix(`/api/auth/login/`) || Path(`/api/auth/logout`) || Path(`/api/auth/refresh`) || Path(`/api/auth/handoff/exchange`) || Path(`/api/auth/healthz`) || PathPrefix(`/api/auth/password/`) || Path(`/api/auth/sso/start`) || Path(`/api/auth/sso/callback`) || Path(`/api/auth/saml/start`) || Path(`/api/auth/saml/callback`) || PathRegexp(`^/api/auth/branding/[^/]+/[^/]+$`) || PathRegexp(`^/api/auth/tenant/theme/[^/]+$`) || Path(`/api/auth/installation`) || PathPrefix(`/api/auth/installation/`) || Path(`/api/auth/point/claim`) || Path(`/api/auth/mobile/find-workspaces`) || PathRegexp(`^/api/auth/mobile/invites/[A-Za-z0-9]+/check$`) || Path(`/api/auth/security-reset/request`) || Path(`/api/auth/security-reset/peek`) || Path(`/api/auth/security-reset/redeem`) || Path(`/api/auth/oidc/.well-known/openid-configuration`) || Path(`/api/auth/oidc/jwks`) || Path(`/api/auth/oidc/authorize`) || Path(`/api/auth/oidc/token`) || Path(`/api/auth/oidc/userinfo`)"
      service: auth
      priority: 100
      middlewares: [strip-identity, public-rate-limit, security-headers]
    careers-public:
      # The careers page and job applications only. Other /api/public/<app>
      # paths have routers of their own below.
      rule: "PathPrefix(`/api/public/jobs`) || PathPrefix(`/api/public/recruitment`)"
      service: hr
      priority: 100
      middlewares: [strip-identity, public-rate-limit, security-headers]
    documents-public:
      rule: "PathPrefix(`/api/public/documents`)"
      service: documents
      priority: 110
      middlewares: [strip-identity, public-rate-limit, security-headers]
    notifications-public:
      # EXACT paths: a prefix widened to /api/notifications/webhooks (the
      # signed-in webhook settings), which then never loaded.
      rule: "Path(`/api/notifications/unsubscribe`) || Path(`/api/notifications/oauth/google/callback`) || Path(`/api/notifications/oauth/microsoft/callback`)"
      service: notifications
      priority: 120
      middlewares: [strip-identity, public-rate-limit, security-headers]
    documents-stream:
      # The document viewer and the OnlyOffice editor fetch and save a file
      # with a signed token in the address (no sign-in by design); the
      # service checks the token.
      rule: "PathPrefix(`/api/documents/onlyoffice/stream/`) || PathPrefix(`/api/documents/onlyoffice/callback/`)"
      service: documents
      priority: 120
      middlewares: [strip-identity, security-headers]
    project-public:
      # Client share links and the public request form of Projects.
      rule: "PathPrefix(`/api/project/public/share`) || PathPrefix(`/api/project/intake/public`)"
      service: project_management
      priority: 120
      middlewares: [strip-identity, public-rate-limit, security-headers]
    insights-public:
      # Insights share links for people outside the company.
      rule: "PathPrefix(`/api/insights/public/`)"
      service: insights
      priority: 120
      middlewares: [strip-identity, public-rate-limit, no-cors, security-headers]
    lms-public:
      rule: "PathPrefix(`/api/public/lms`)"
      service: lms
      priority: 110
      middlewares: [strip-identity, public-rate-limit, security-headers]
    gamification-public:
      rule: "PathPrefix(`/api/public/gamification`)"
      service: gamification
      priority: 110
      middlewares: [strip-identity, public-rate-limit, security-headers]
    activities-public:
      # Replies to a meeting invitation from the e-mail (accept / decline).
      rule: "PathPrefix(`/api/activities/invite/respond`)"
      service: activities
      priority: 120
      middlewares: [strip-identity, public-rate-limit, security-headers]
    sales-orders-public:
      # From release 1.2.0 (an older release answers 404 here).
      rule: "PathPrefix(`/api/sales-orders/public/`)"
      service: sales_orders
      priority: 120
      middlewares: [strip-identity, public-rate-limit, security-headers]
    fleet-public:
      # From release 1.2.0 (an older release answers 404 here).
      rule: "PathPrefix(`/api/fleet/public/`)"
      service: fleet
      priority: 120
      middlewares: [strip-identity, public-rate-limit, security-headers]
    accounting-portal:
      rule: "PathPrefix(`/api/accounting/portal/`) || PathPrefix(`/api/accounting/public/einvoicing/`)"
      service: accounting
      priority: 100
      middlewares: [strip-identity, public-rate-limit, security-headers]
    crm-portal:
      rule: "PathPrefix(`/api/portal`)"
      service: crm
      priority: 100
      middlewares: [strip-identity, public-rate-limit, security-headers]
    chat-public:
      rule: "Path(`/api/chat/ws`) || Path(`/api/chat/healthz`)"
      service: chat
      priority: 120
      middlewares: [strip-identity, public-rate-limit, security-headers]
    helpdesk-public:
      rule: "PathPrefix(`/api/helpdesk/public`)"
      service: helpdesk
      priority: 110
      middlewares: [strip-identity, public-rate-limit, security-headers]
    ecommerce-public:
      rule: "PathPrefix(`/api/ecommerce/public/v1/`)"
      service: ecommerce
      priority: 120
      middlewares: [strip-identity, public-rate-limit, security-headers]
    procurement-public:
      # Supplier portal: no sign-in and no licence check at the gateway. The
      # service resolves the company from the link or the address and answers
      # the same 404 for anything it does not know. Above careers-public (100).
      rule: "PathPrefix(`/api/public/procurement/`)"
      service: procurement
      priority: 120
      middlewares: [strip-identity, public-rate-limit, security-headers]
    procurement-public-otp:
      # Asking for and checking a one-time sign-in code. Above procurement-public.
      rule: "PathRegexp(`^/api/public/procurement/[a-z0-9-]+/otp/(request|verify)$`)"
      service: procurement
      priority: 130
      middlewares: [strip-identity, procurement-public-otp, security-headers]
    procurement-public-register:
      # A company applying to become a supplier (the open form, an invitation
      # link, and that form's file uploads). Above procurement-public.
      rule: "Method(`POST`) && PathRegexp(`^/api/public/procurement/([a-z0-9-]+/register|register/[A-Za-z0-9_-]+(/uploads)?)$`)"
      service: procurement
      priority: 130
      middlewares: [strip-identity, procurement-public-register, security-headers]
    procurement-public-register-uploads:
      # The open registration form's file uploads (POST /:tenant/uploads). A
      # signed-in supplier's bid uploads (/me/uploads) stay on the portal limit.
      rule: "Method(`POST`) && PathRegexp(`^/api/public/procurement/[a-z0-9-]+/uploads$`) && !Path(`/api/public/procurement/me/uploads`)"
      service: procurement
      priority: 130
      middlewares: [strip-identity, procurement-public-register, security-headers]
    contracts-public:
      # Signer page, signed PDF and verify form: no sign-in and no licence check
      # at the gateway. The service resolves the workspace from the signer link
      # and answers the same 404 for anything it does not know. Above
      # careers-public (100).
      rule: "PathPrefix(`/api/public/contracts/`)"
      service: contracts
      priority: 120
      middlewares: [strip-identity, public-rate-limit, security-headers]
    contracts-public-otp:
      # Asking for and checking a one-time code, and starting a UAE PASS or
      # Nafath sign-in. Above contracts-public.
      rule: "PathRegexp(`^/api/public/contracts/sign/[A-Za-z0-9_-]+/(otp/(request|verify)|idp/[a-z_]+/start)$`)"
      service: contracts
      priority: 130
      middlewares: [strip-identity, contracts-public-otp, security-headers]
    contracts-public-verify:
      # The signed-copy check form. Above contracts-public.
      rule: "PathRegexp(`^/api/public/contracts/[a-z0-9-]+/verify$`)"
      service: contracts
      priority: 125
      middlewares: [strip-identity, contracts-public-verify, security-headers]
    subscriptions-public:
      rule: "PathPrefix(`/api/subscriptions/public/`)"
      service: subscriptions
      priority: 120
      middlewares: [strip-identity, public-rate-limit, security-headers]
    attendance-public:
      # Clock-in machines (punch API, ZKTeco, Hikvision) and paired kiosk
      # tablets. See docs/attendance-machines.md.
      rule: "PathPrefix(`/api/attendance/public/`)"
      service: attendance
      priority: 120
      middlewares: [strip-identity, attendance-public-rate-limit, attendance-public-inflight, security-headers]
    attendance-iclock:
      rule: "PathPrefix(`/iclock/`)"
      service: attendance
      priority: 120
      middlewares: [strip-identity, attendance-public-rate-limit, attendance-public-inflight, attendance-iclock-rewrite, security-headers]
    attendance-zk:
      rule: "PathPrefix(`/zk/`)"
      service: attendance
      priority: 120
      middlewares: [strip-identity, attendance-public-rate-limit, attendance-public-inflight, attendance-zk-rewrite, security-headers]
    files:
      # Browser uploads and downloads with signed links. The store checks the
      # signature; the gateway only passes the request through unchanged.
      rule: 'PathPrefix(`/{{ env "STORAGE_BUCKET" }}/`)'
      service: objects
      priority: 200
    api-fallback:
      # Any other /api address (including /api/platform, which does not exist
      # on an installation) gets the auth service's plain 404, never the web
      # app's redirect.
      rule: "PathPrefix(`/api/`)"
      service: auth
      priority: 2
      middlewares: [strip-identity, security-headers]
    drawio:
      # The optional draw.io editor (compose profile `drawio`). Static pages,
      # no sign-in: the Diagrams app hands it the drawing in the browser.
      # Answers 502 while the add-on is off.
      rule: "Path(`/drawio`) || PathPrefix(`/drawio/`)"
      service: drawio
      priority: 150
      middlewares: [strip-identity, security-headers]
    onlyoffice:
      # The document editor (compose profile `onlyoffice`), reached through its
      # small proxy, which tells it the /onlyoffice/ path it sits under. No
      # sign-in here: the editor's own token (the shared secret) is the check,
      # and the files it opens are fetched by it from the documents service
      # inside Docker. Answers 502 while the add-on is off or starting.
      rule: "Path(`/onlyoffice`) || PathPrefix(`/onlyoffice/`)"
      service: onlyoffice
      priority: 150
      middlewares: [strip-identity, security-headers]
    web:
      rule: "PathPrefix(`/`)"
      service: web
      priority: 1
      middlewares: [web-headers]

