# Tarleaks ERP gateway routes (Traefik file provider).
#
# Every request first has the identity headers removed, so a client can never
# claim a workspace or user on its own. Signed-in routes then ask the auth
# service who the caller is (license-check), which sets those headers again.
# There is no /api/platform route: a self-hosted installation has no platform
# console. Uploaded files go to the bundled store under /<bucket>/.
http:
  middlewares:
    strip-identity:
      headers:
        customRequestHeaders:
          X-Tenant-Id: ""
          X-Tenant-Slug: ""
          X-User-Id: ""
          X-User-Email: ""
          X-User-Roles: ""
          X-Permission-Set: ""
          X-Permissions: ""
          X-License-Modules: ""
          X-License-Plan: ""
          X-Is-Super-Admin: ""
          X-Actor-User-Id: ""
          X-Actor-Type: ""
          X-Api-Token-Id: ""
          X-Sandbox-Mode: ""
          X-Internal-Token: ""
          X-Erp-Actor: ""
    license-check:
      forwardAuth:
        # Through the keep-alive proxy (docker-compose.yml, `authproxy`): the
        # gateway's own client would open a connection per request and run out
        # of ports under load (QA-PERF-04).
        address: http://authproxy:8099/internal/authorize
        trustForwardHeader: true
        authResponseHeaders:
          - X-Tenant-Id
          - X-User-Id
          - X-User-Roles
          - X-Permission-Set
          - X-Permissions
          - X-License-Modules
          - X-License-Plan
          - X-Is-Super-Admin
          - X-Actor-User-Id
          - X-Actor-Type
          - X-Api-Token-Id
          - X-Sandbox-Mode
    public-rate-limit:
      rateLimit:
        average: 60
        burst: 30
    # The supplier portal's sign-in codes (request and check) and its
    # registration forms get tighter limits per address than the rest of the
    # portal: they are what a script would hammer. The service keeps its own
    # limits as well (per account, per mailbox, per link).
    procurement-public-otp:
      rateLimit:
        period: 1m
        average: 6
        burst: 10
        sourceCriterion:
          ipStrategy:
            depth: 0
    procurement-public-register:
      rateLimit:
        period: 1m
        average: 10
        burst: 20
        sourceCriterion:
          ipStrategy:
            depth: 0
    # The signer page's one-time codes (request and check): what a script would
    # hammer. The service keeps its own limits per link and per signer.
    contracts-public-otp:
      rateLimit:
        period: 1m
        average: 6
        burst: 10
        sourceCriterion:
          ipStrategy:
            depth: 0
    # The public "check a signed copy" form: a lookup, so a looser limit than
    # the code routes.
    contracts-public-verify:
      rateLimit:
        period: 1m
        average: 30
        burst: 30
        sourceCriterion:
          ipStrategy:
            depth: 0
    # HTTPS only (TARLEAKS_TLS=letsencrypt|cloudflare): browsers remember for a
    # year to use https:// for this name. Attached by config/https/*.yml to the
    # 443 entry point; never used on plain http, where it would lock people
    # out of a local installation.
    hsts:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: false
    security-headers:
      headers:
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        frameDeny: false
        customResponseHeaders:
          X-Powered-By: ""
          # No server name or version for a scanner to match.
          Server: ""
    # The web app's pages: no other website may show them inside a frame
    # (clickjacking). 'self', not 'none': the app frames its own previews.
    # Only frame-ancestors: a fuller policy (script-src, …) would break the
    # app's own loading, which newer web images set themselves. Same values
    # as the product's web image.
    web-headers:
      headers:
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        customFrameOptionsValue: SAMEORIGIN
        contentSecurityPolicy: "frame-ancestors 'self'"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""
    # Public Insights share links answer data to anyone holding the link; no
    # other website may read it from a visitor's browser.
    no-cors:
      headers:
        customResponseHeaders:
          Access-Control-Allow-Origin: ""
          Access-Control-Allow-Credentials: ""
    # Clock-in machines and kiosk tablets (/api/attendance/public/, /iclock/,
    # /zk/) send a key of their own, never a sign-in, so these routes skip
    # license-check; the attendance service checks the key and the licence.
    # 300 requests a minute per address, burst 100: every machine in an office
    # can share one address, and a busy door is a few punches a minute.
    attendance-public-rate-limit:
      rateLimit:
        period: 1m
        average: 300
        burst: 100
        sourceCriterion:
          ipStrategy:
            depth: 0
    # At most 20 requests in flight per address, so one address's slow
    # uploads cannot tie up the service.
    attendance-public-inflight:
      inFlightReq:
        amount: 20
        sourceCriterion:
          ipStrategy:
            depth: 0
    # ZKTeco "Cloud server" (ADMS), serial-number address: /iclock/...
    attendance-iclock-rewrite:
      replacePathRegex:
        regex: "^/iclock/(.*)"
        replacement: "/api/attendance/public/v1/adms-sn/iclock/$1"
    # ZKTeco "Cloud server" (ADMS), key address: /zk/atd_<key>/iclock/...
    # Any other /zk/ address is not rewritten and gets a plain 404.
    attendance-zk-rewrite:
      replacePathRegex:
        regex: "^/zk/(atd_[a-z2-7]{48})/iclock/(.*)"
        replacement: "/api/attendance/public/v1/adms/$1/iclock/$2"

  routers:
    auth:
      rule: "PathPrefix(`/api/auth`)"
      service: auth
      priority: 10
      middlewares: [strip-identity, license-check, security-headers]
    hr:
