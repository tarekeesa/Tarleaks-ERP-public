# =============================================================================
# Tarleaks ERP — self-hosted installation
#
# Pre-built images only. Run ./install.sh (Linux, macOS) or .\install.ps1
# (Windows) the first time: it checks the machine, writes .env with generated
# secrets, asks which apps to run and starts them.
#
# Apps: only the apps you chose run (TARLEAKS_APPS in .env), plus what they
# need and the base apps. Each app's service has a compose profile named after
# it; the installer and ./tarleaks apps write COMPOSE_PROFILES from
# config/apps.tsv. Infrastructure, sign-in and the base apps always run.
# Editors (add-ons, rows of kind `addon` in config/apps.tsv): the installer and
# ./tarleaks append them to COMPOSE_PROFILES when the apps that use them run
# (switch them with ./tarleaks editors on|off):
#   ,onlyoffice        the document editor: New, Edit and versions in Documents
#   ,drawio            the diagram editor of the Diagrams app
#   ,diagrams-engine   the engine behind the Diagrams app's AI drawing
#
# Every image is published for linux/amd64 and linux/arm64. Without internet,
# load the offline bundle first: ./tarleaks load-bundle <folder>.
# =============================================================================

name: tarleaks

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# Settings every ERP service shares. Secrets come from .env (generated by the
# installer); `:?` makes compose refuse to start with a clear message if one is
# missing, rather than starting services that fail one by one.
x-env: &env
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-tarleaks}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is not set - run ./install.sh}@rabbitmq:5672/%2f
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - run ./install.sh}
  # The public half of the sign-in token key (Ed25519), {"<name>": "<PEM>"},
  # made once by the installer. Empty in an older .env: tokens are then checked
  # with JWT_SECRET only, as before.
  JWT_PUBLIC_KEYS: ${JWT_PUBLIC_KEYS:-}
  CLUSTER_DSN_KEY: ${CLUSTER_DSN_KEY:?CLUSTER_DSN_KEY is not set - run ./install.sh}
  AUTH_SERVICE_URL: http://auth:8001
  ROOT_DOMAIN: ${TARLEAKS_HOST:-localhost}
  ROOT_DOMAINS: ${TARLEAKS_HOST:-localhost}
  PUBLIC_BASE_URL: ${TARLEAKS_URL:-http://localhost}
  DEPLOYMENT_MODE: onprem
  # Both names: images pinned before the rename read only NEXUS_*.
  TARLEAKS_DEPLOYMENT: self-hosted
  NEXUS_DEPLOYMENT: self-hosted
  STRICT_TENANT_URL_ISOLATION: "false"
  AUTO_PROVISION_TENANT_DB: "true"
  INTERNAL_DMS_HR_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is not set - run ./install.sh}
  PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:?PORTAL_JWT_SECRET is not set - run ./install.sh}
  NOTIFICATIONS_KEK: ${NOTIFICATIONS_KEK:?NOTIFICATIONS_KEK is not set - run ./install.sh}
  NOTIFICATIONS_UNSUB_SECRET: ${NOTIFICATIONS_UNSUB_SECRET:?NOTIFICATIONS_UNSUB_SECRET is not set - run ./install.sh}
  NOTIFICATIONS_OAUTH_SECRET: ${NOTIFICATIONS_OAUTH_SECRET:?NOTIFICATIONS_OAUTH_SECRET is not set - run ./install.sh}
  HELPDESK_TOKEN_KEY: ${HELPDESK_TOKEN_KEY:?HELPDESK_TOKEN_KEY is not set - run ./install.sh}
  SUBSCRIPTIONS_KEY_SEAL_KEY: ${SUBSCRIPTIONS_KEY_SEAL_KEY:?SUBSCRIPTIONS_KEY_SEAL_KEY is not set - run ./install.sh}
  MARKETPLACE_TOKEN_KEY: ${MARKETPLACE_TOKEN_KEY:?MARKETPLACE_TOKEN_KEY is not set - run ./install.sh}
  INSIGHTS_SOURCE_KEY: ${INSIGHTS_SOURCE_KEY:?INSIGHTS_SOURCE_KEY is not set - run ./install.sh}
  ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET is not set - run ./install.sh}
  ONLYOFFICE_STORAGE_BACKEND: local
  ONLYOFFICE_STORAGE_ROOT: /var/hr-docs
  # The bundled file store: dialled inside Docker, reached by browsers at the
  # installation's own address. Every service that signs file links needs both.
  TARLEAKS_STORAGE_ENDPOINT: ${TARLEAKS_STORAGE_ENDPOINT:-${NEXUS_STORAGE_ENDPOINT:-http://objects:7070}}
  TARLEAKS_STORAGE_PRESIGN_ENDPOINT: ${TARLEAKS_STORAGE_PRESIGN_ENDPOINT:-${NEXUS_STORAGE_PRESIGN_ENDPOINT:-${TARLEAKS_URL:-http://localhost}}}
  NEXUS_STORAGE_ENDPOINT: ${TARLEAKS_STORAGE_ENDPOINT:-${NEXUS_STORAGE_ENDPOINT:-http://objects:7070}}
  NEXUS_STORAGE_PRESIGN_ENDPOINT: ${TARLEAKS_STORAGE_PRESIGN_ENDPOINT:-${NEXUS_STORAGE_PRESIGN_ENDPOINT:-${TARLEAKS_URL:-http://localhost}}}
  # The store's bucket and keys go to every service, not only to auth: from
  # 1.2.0 a company that never chose a file store uses this one, and the
  # services that sign file links (documents, hr, reports, chat, the PDF
  # tools) need the keys to do it. Before, only the first company's saved
  # settings worked; a sample company or one added later answered 502
  # "storage is not configured" on every upload.
  TARLEAKS_STORAGE_PROVIDER: ${TARLEAKS_STORAGE_PROVIDER:-${NEXUS_STORAGE_PROVIDER:-nas_versitygw}}
  NEXUS_STORAGE_PROVIDER: ${TARLEAKS_STORAGE_PROVIDER:-${NEXUS_STORAGE_PROVIDER:-nas_versitygw}}
  TARLEAKS_STORAGE_BUCKET: ${STORAGE_BUCKET:-tarleaks-files}
  NEXUS_STORAGE_BUCKET: ${STORAGE_BUCKET:-tarleaks-files}
  TARLEAKS_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
  NEXUS_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
  TARLEAKS_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
  NEXUS_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
  TARLEAKS_STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  NEXUS_STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  # local (this computer or the office network, http) or production (a real
  # domain, HTTPS only). The services check their public addresses against
  # it at start; ./tarleaks doctor refuses a mix-up. docs/configuration.md#profile
  TARLEAKS_PROFILE_ENV: ${TARLEAKS_PROFILE_ENV:-local}
  # true: this installation runs without internet (docs/offline.md). Set it
  # with ./tarleaks offline on|sealed|off, which also switches off every
  # optional outside service (AI keys, the AI drawing engine).
  TARLEAKS_OFFLINE: ${TARLEAKS_OFFLINE:-false}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  RUST_LOG: ${LOG_LEVEL:-info}
  TZ: ${TZ:-UTC}
  # Read by the <app>-jobs containers only (config/jobs/run-jobs.sh).
  JOBS_START_DELAY: ${JOBS_START_DELAY:-120}
  JOBS_TIMEOUT: ${JOBS_TIMEOUT:-3600}
  # Outbound proxy for the few outside connections the ERP makes (licence
  # check-in, e-invoicing portals, and integrations a workspace turns on).
  # Empty = connect directly. Must be a tunnelling (CONNECT) proxy: the ERP
  # checks certificates against the public authorities only, so a proxy that
  # re-signs HTTPS breaks those connections. docs/configuration.md#outbound-proxy
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  HTTP_PROXY: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  http_proxy: ${HTTP_PROXY:-}
  # The installation's own services and address never go through the proxy;
  # NO_PROXY in .env adds to this list (a mail relay, a NAS, your LAN).
  NO_PROXY: &no_proxy "localhost,127.0.0.1,::1,${TARLEAKS_HOST:-localhost},\
    postgres,redis,rabbitmq,objects,gateway,authproxy,web,drawio,onlyoffice,\
    onlyoffice-proxy,diagrams-engine,auth,migrate,hr,\
    attendance,payroll,accounting,activities,notifications,documents,reports,\
    parties,crm,inventory,sales_orders,chat,project_management,lms,\
    gamification,assets,helpdesk,fleet,correspondence,insights,ecommerce,pos,\
    rental,procurement,construction,contracts,subscriptions,pdftools,diagrams,\
    imtithal,iso42001${NO_PROXY:+,${NO_PROXY:-}}"
  no_proxy: *no_proxy

# One ERP service: pre-built image, waits for its infrastructure.
#
# After a reboot Docker starts every container at once and ignores depends_on,
# and a service that finds no message queue at start never receives events
# until it is restarted ("deaf"). So each service first waits for RabbitMQ (its
# management port answers only once the broker has fully started), at most 5
# minutes, then runs the image's own entrypoint (/app/entrypoint).
x-service: &service
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq-init: { condition: service_completed_successfully }
  entrypoint:
    - /bin/sh
    - -c
    - |
      i=0
      until curl -fs -o /dev/null --max-time 3 http://rabbitmq:15672/; do
        i=$$((i + 1))
        if [ "$$i" -ge 100 ]; then
          echo "The message queue (rabbitmq) is still not answering after 5 minutes: starting without it. Events will not arrive until ./tarleaks restart." >&2
          break
        fi
        [ $$((i % 10)) -eq 1 ] && echo "Waiting for the message queue (rabbitmq)..."
        sleep 3
      done
      exec /app/entrypoint
  stop_grace_period: 20s
  # A service that runs away is stopped and restarted at this size instead of
  # taking the whole machine down (docs/configuration.md#memory-limits).
  mem_limit: ${SERVICE_MEM_LIMIT:-1g}
  # `host.docker.internal` reaches this machine from inside a container on
  # Linux too (Docker Desktop already has it): from 1.2.0 a company can keep its
  # data in a PostgreSQL that runs on this same machine (Settings, Data location).
  extra_hosts:
    - "host.docker.internal:host-gateway"

# The scheduled jobs of one app (production runs them as CronJobs): the app's
# own image runs config/jobs/run-jobs.sh, which calls `/app/service <job>` on
# each job's interval, logs a failure and keeps going. Its `command:` lists the
# jobs as <every>:<subcommand>. Same profile as its app, so it runs only when
# the app does. JOBS_START_DELAY and JOBS_TIMEOUT in .env tune them.
x-jobs: &jobs
  restart: unless-stopped
  logging: *logging
  init: true
  stop_grace_period: 30s
  mem_limit: ${JOBS_MEM_LIMIT:-512m}
  entrypoint: ["/bin/sh", "/jobs/run-jobs.sh"]
  volumes:
    - ./config/jobs:/jobs:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # ---------------------------------------------------------------------------
  # Infrastructure (third-party images, pinned, multi-architecture)
  # A pin moved here moves in deploy/selfhosted/third-party-images.txt of the
  # private repository too: that list fills the offline bundle.
  # ---------------------------------------------------------------------------
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg16}
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tarleaks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run ./install.sh}
      POSTGRES_DB: ${POSTGRES_DB:-tarleaks}
      TZ: ${TZ:-UTC}
    # Safety limits (docs/configuration.md#database-and-message-queue): one
    # query may run at most 300 s (the longest request production allows), a
    # transaction left open and idle is ended after 60 s, so one runaway or
    # forgotten query cannot hold the server. Backups and restores lift these
    # limits for their own sessions (pg_dump does that by itself).
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-300}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - statement_timeout=${PG_STATEMENT_TIMEOUT:-300s}
      - -c
      - idle_in_transaction_session_timeout=${PG_IDLE_IN_TRANSACTION_TIMEOUT:-60s}
      - -c
      - lock_timeout=${PG_LOCK_TIMEOUT:-0}
    shm_size: ${PG_SHM_SIZE:-256mb}
    # Without a limit the database grew to 11 GB under load and never gave it
    # back. At the limit the system stops one database process; PostgreSQL then
    # restarts its connections within seconds. The installer sizes it.
    mem_limit: ${PG_MEM_LIMIT:-2g}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    # Ready means reachable over the network, as the services reach it. On the
    # first start the image initialises the database with a temporary server
    # that listens only on its local socket: a socket check said "ready" then,
    # and postgres-prepare's connection was refused (a fresh install failed
    # with "service postgres-prepare didn't complete successfully").
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30

  # Every start: the extensions the ERP needs, in the platform database AND in
  # template1, which a new workspace database is copied from (without them
  # setup "succeeded" but most apps never worked). Idempotent, takes a second.
  postgres-prepare:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg16}
    restart: "no"
    logging: *logging
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-tarleaks}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run ./install.sh}
      PLATFORM_DB: ${POSTGRES_DB:-tarleaks}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Belt and braces: wait (at most a minute) until the server takes
        # connections over the network.
        i=0
        until pg_isready -q; do
          i=$$((i + 1)); [ "$$i" -le 30 ] || { echo 'the database does not accept connections'; exit 2; }
          sleep 2
        done
        for db in template1 "$$PLATFORM_DB"; do
          psql -X -q -v ON_ERROR_STOP=1 -d "$$db" \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"' \
            -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto' \
            -c 'CREATE EXTENSION IF NOT EXISTS citext' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA public' \
            -c 'CREATE EXTENSION IF NOT EXISTS vector' \
            -c 'CREATE EXTENSION IF NOT EXISTS btree_gist'
        done
        echo 'database extensions ready'

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.7-alpine}
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes", "--save", "300", "10"]
    mem_limit: ${REDIS_MEM_LIMIT:-1g}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13.7-management-alpine}
    restart: unless-stopped
    logging: *logging
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tarleaks}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is not set - run ./install.sh}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    mem_limit: ${RABBITMQ_MEM_LIMIT:-1g}
    # Healthy once both listeners accept connections (AMQP 5672 for the
    # services, 15672 for the topology loader). A plain port probe: the
    # rabbitmq-diagnostics check started an Erlang VM every 10 s and used about
    # half a CPU core all the time.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5672 && nc -z 127.0.0.1 15672"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Loads the message topology (exchanges, queues, bindings, and the limits
  # policy that keeps an unread queue from growing for ever) once RabbitMQ is
  # up. Idempotent: running it again changes nothing. It also deletes the
  # queues of services this kit does not ship (social, meet), which older kits
  # declared: nothing ever read them, so they only filled up.
  rabbitmq-init:
    image: ${CURL_IMAGE:-curlimages/curl:8.17.0}
    restart: "no"
    logging: *logging
    depends_on:
      rabbitmq: { condition: service_healthy }
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-tarleaks}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is not set - run ./install.sh}
    volumes:
      - ./config/rabbitmq/definitions.json:/definitions.json:ro
    entrypoint: ["sh", "-c"]
    command:
      - >-
        curl -fsS -u "$$RABBITMQ_USER:$$RABBITMQ_PASSWORD"
        -H 'content-type: application/json'
        -X POST --data-binary @/definitions.json
        http://rabbitmq:15672/api/definitions && echo 'message topology loaded'
        && for q in social.fetch-metrics social.from-accounting social.from-hr
        social.publish-due social.refresh-tokens social.sentiment-pending
        social.topic-runs meet.asr meet.screens; do
        curl -fsS -o /dev/null -u "$$RABBITMQ_USER:$$RABBITMQ_PASSWORD"
        -X DELETE "http://rabbitmq:15672/api/queues/%2f/$$q" 2>/dev/null
        && echo "removed the unused queue $$q"; true; done

  # S3-compatible file store for documents, attachments and exports: a plain
  # directory on the `files` volume (versitygw, Apache-2.0). Browsers reach it
  # through the gateway; set TARLEAKS_STORAGE_* in .env to use AWS S3, Cloudflare
  # R2, Wasabi or a NAS instead (see docs/configuration.md).
  objects:
    image: ${OBJECTS_IMAGE:-versity/versitygw:v1.8.0}
    restart: unless-stopped
    logging: *logging
    environment:
      ROOT_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is not set - run ./install.sh}
      ROOT_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is not set - run ./install.sh}
    command: ["--port", ":7070", "posix", "/data"]
    mem_limit: ${OBJECTS_MEM_LIMIT:-512m}
    volumes:
      - files:/data
    depends_on:
      objects-init: { condition: service_completed_successfully }

  # With versitygw a bucket is a folder: create it before the store starts.
  objects-init:
    image: ${ALPINE_IMAGE:-alpine:3.22.6}
    restart: "no"
    user: "0:0"
    logging: *logging
    entrypoint: ["sh", "-c", "mkdir -p /data/${STORAGE_BUCKET:-tarleaks-files} && echo 'file store ready'"]
    volumes:
      - files:/data

  # Not a service: the tool `./tarleaks backup` and `restore` run (with
  # `docker compose run`) to copy the `files` and `hrdocs` volumes. Compose
  # finds the volumes of THIS installation whatever its project name, and the
  # database image's GNU tar keeps the file store's metadata (content type,
  # ETag, checksums, kept in extended attributes). Its profile keeps it out of
  # `up`; no network.
  toolbox:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg16}
    profiles: [tools]
    restart: "no"
    logging: *logging
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - files:/vol/files
      - hrdocs:/vol/hrdocs

  gateway:
    image: ${TRAEFIK_IMAGE:-traefik:v3.7.14}
    restart: unless-stopped
    logging: *logging
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=300s
      - --entrypoints.web.transport.respondingTimeouts.writeTimeout=300s
      - --ping=true
      - --log.level=${GATEWAY_LOG_LEVEL:-WARN}
      - --accesslog=${GATEWAY_ACCESS_LOG:-false}
      - --api.dashboard=false
      # No calls home: no version check, no anonymous usage statistics.
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:-tarleaks-files}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    mem_limit: ${GATEWAY_MEM_LIMIT:-512m}
    # Each signed-in request costs the gateway one new connection to the
    # sign-in check (its client keeps only two open), so above about ten people
    # working at once it ran out of local ports and answered 500/502
    # (QA-PERF-04). Three things keep it going: the check goes to `authproxy`,
    # which keeps a pool of open connections to the sign-in service; a wider
    # port range; and closed connections' ports are used again at once.
    sysctls:
      net.ipv4.ip_local_port_range: "10000 65535"
      net.ipv4.tcp_tw_reuse: "1"
    volumes:
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The sign-in check of the gateway goes through this small proxy (the same
  # pattern the hosted platform runs): the gateway asks it
  # about every signed-in request, and it keeps a pool of open connections to
  # the sign-in service instead of opening and closing one per request.
  # config/authproxy/nginx.conf; docs/configuration.md#many-people-at-once.
  authproxy:
    image: ${AUTHPROXY_IMAGE:-nginx:1.30.6-alpine}
    restart: unless-stopped
    logging: *logging
    command: ["nginx", "-c", "/etc/authproxy/nginx.conf", "-g", "daemon off;"]
    mem_limit: ${AUTHPROXY_MEM_LIMIT:-128m}
    volumes:
      - ./config/authproxy/nginx.conf:/etc/authproxy/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8099/authproxy-health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Tarleaks ERP — core (always on)
  # ---------------------------------------------------------------------------
  web:
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/web:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    restart: unless-stopped
    logging: *logging
    environment:
      # The diagram editor the Diagrams app opens. Empty = that editor is
      # hidden. With the `drawio` add-on the installer fills
      # TARLEAKS_DRAWIO_URL (<address>/drawio/); DRAWIO_URL in .env overrides it.
      DRAWIO_URL: ${TARLEAKS_DRAWIO_URL:+${DRAWIO_URL:-${TARLEAKS_DRAWIO_URL:-}}}
    mem_limit: ${WEB_MEM_LIMIT:-256m}

  auth:
    <<: *service
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/auth:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    depends_on:
      postgres: { condition: service_healthy }
      postgres-prepare: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rabbitmq-init: { condition: service_completed_successfully }
    environment: &auth-env
      <<: *env
      # Setup prepares the workspace in one request (about a minute on modest
      # hardware); production gives these services 300 s too.
      HTTP_REQUEST_TIMEOUT_SECS: ${HTTP_LONG_REQUEST_TIMEOUT_SECS:-300}
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dauth,public"
      # Only auth signs sign-in tokens. With the key in .env it signs them with
      # Ed25519 (JWT_SIGNING_KEY_DER, published in JWT_PUBLIC_KEYS), which
      # two-step confirmation needs (sealed tenders); tokens signed before stay
      # valid. Without it, HS256 with JWT_SECRET, as before.
      JWT_SIGNING_ALG: ${JWT_SIGNING_KEY_DER:+eddsa}
      JWT_SIGNING_KID: ${JWT_SIGNING_KID:-}
      # (Compose allows no line break inside ${…}: without the key this is
      # blank lines, which nothing reads.)
      JWT_SIGNING_KEY: "${JWT_SIGNING_KEY_DER:+-----BEGIN PRIVATE KEY-----}\n${JWT_SIGNING_KEY_DER:-}\n${JWT_SIGNING_KEY_DER:+-----END PRIVATE KEY-----}\n"
      # Where this installation creates its workspace database.
      BOOTSTRAP_CLUSTER_DSNS: '{"local":{"kind":"shared","dsn":"postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/postgres","capacity_max":10}}'
      # Each key is passed under both names: images pinned before the rename
      # read only NEXUS_*, and an .env not yet migrated by ./install.sh still works.
      # No `:?` inside the fallback: Compose evaluates it even when the first
      # name is set, so every .env written by today's installer failed. Without
      # a code the setup screen refuses to run (SETUP_CODE_INVALID).
      TARLEAKS_SETUP_CODE: ${TARLEAKS_SETUP_CODE:-${NEXUS_SETUP_CODE:-}}
      NEXUS_SETUP_CODE: ${TARLEAKS_SETUP_CODE:-${NEXUS_SETUP_CODE:-}}
      TARLEAKS_LICENSE_KEY: ${TARLEAKS_LICENSE_KEY:-${NEXUS_LICENSE_KEY:-}}
      NEXUS_LICENSE_KEY: ${TARLEAKS_LICENSE_KEY:-${NEXUS_LICENSE_KEY:-}}
      TARLEAKS_AVAILABLE_MODULES: ${TARLEAKS_AVAILABLE_MODULES:-${NEXUS_AVAILABLE_MODULES:-}}
      NEXUS_AVAILABLE_MODULES: ${TARLEAKS_AVAILABLE_MODULES:-${NEXUS_AVAILABLE_MODULES:-}}
      TARLEAKS_STORAGE_PROVIDER: ${TARLEAKS_STORAGE_PROVIDER:-${NEXUS_STORAGE_PROVIDER:-nas_versitygw}}
      NEXUS_STORAGE_PROVIDER: ${TARLEAKS_STORAGE_PROVIDER:-${NEXUS_STORAGE_PROVIDER:-nas_versitygw}}
      TARLEAKS_STORAGE_BUCKET: ${STORAGE_BUCKET:-tarleaks-files}
      NEXUS_STORAGE_BUCKET: ${STORAGE_BUCKET:-tarleaks-files}
      TARLEAKS_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      NEXUS_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      TARLEAKS_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      NEXUS_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      TARLEAKS_STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      NEXUS_STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/auth/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Signed-in sessions that ended are cleared hourly; security events older than 180 days daily; from 1.2.0 the app's own nightly company backups (backup-tick, left out by older releases).
  auth-jobs:
    <<: *jobs
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/auth:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    depends_on:
      auth: { condition: service_healthy }
    environment: *auth-env
    command: ["1h:prune-sessions", "1d:retention-sweep-events", "1h:backup-tick"]

  # Applies database updates to the workspace after an upgrade, then exits.
  # Its image was nexus-migrate up to 1.1.x and is tarleaks-migrate from 1.2.0;
  # ./tarleaks and the installers set TARLEAKS_MIGRATE_IMAGE from the version.
  migrate:
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/${TARLEAKS_MIGRATE_IMAGE:-tarleaks-migrate}:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    restart: "no"
    logging: *logging
    depends_on:
      auth: { condition: service_healthy }
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *env
      PLATFORM_DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dauth,public"
    command: ["sweep"]

  hr:
    <<: *service
    profiles: [hr]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/hr:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &hr-env
      <<: *env
      # The same document editor as Documents (letter and contract templates).
      ONLYOFFICE_DOC_SERVER_URL: ${TARLEAKS_ONLYOFFICE_URL:+${ONLYOFFICE_PUBLIC_URL:-${TARLEAKS_ONLYOFFICE_URL:-}}}
      ONLYOFFICE_CALLBACK_PUBLIC_URL: http://hr:8002
      # Where HR downloads a template the editor saved (from 1.2.0; the link
      # the editor hands back names the browser's address, which does not
      # lead back from inside Docker).
      ONLYOFFICE_INTERNAL_URL: ${TARLEAKS_ONLYOFFICE_URL:+http://onlyoffice}
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dhr,public"
    volumes:
      - hrdocs:/var/hr-docs

  # Surveys hourly; visa, ID and document expiry alerts and certification expiry daily.
  hr-jobs:
    <<: *jobs
    profiles: [hr]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/hr:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    depends_on:
      hr: { condition: service_started }
    environment: *hr-env
    volumes:
      - ./config/jobs:/jobs:ro
      - hrdocs:/var/hr-docs
    command: ["1h:survey-tick", "1d:expiry-sweep", "1d:certification-sweep"]

  attendance:
    <<: *service
    profiles: [attendance]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/attendance:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &attendance-env
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dattendance,public"

  # Clock-in machines: every 5 minutes, finishes punches that a restart left
  # half-processed; once a day, deletes machine punches older than the
  # retention set in Settings -> Attendance.
  attendance-jobs:
    <<: *jobs
    profiles: [attendance]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/attendance:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    depends_on:
      attendance: { condition: service_started }
    environment: *attendance-env
    command: ["5m:device-sweep", "1d:device-purge"]

  payroll:
    <<: *service
    profiles: [payroll]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/payroll:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &payroll-env
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dpayroll,public"

  # Reminders for salary (WPS) files not yet submitted, daily.
  payroll-jobs:
    <<: *jobs
    profiles: [payroll]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/payroll:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    depends_on:
      payroll: { condition: service_started }
    environment: *payroll-env
    command: ["1d:wps-reminders"]

  accounting:
    <<: *service
    profiles: [accounting]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/accounting:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &accounting-env
      <<: *env
      # E-invoicing (ZATCA, FTA). The time server the clock is checked against
      # before signing (host:port; empty = no check, the host clock is used), and an
      # optional address that tells a provider outage from a network one
      # (empty = no such check). docs/network.md
      EINVOICE_NTP_SERVER: ${EINVOICE_NTP_SERVER:-}
      EINVOICE_PROBE_URL: ${EINVOICE_PROBE_URL:-}
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Daccounting,public"

  # Scheduled financial reports and the anomaly scan, daily.
  accounting-jobs:
    <<: *jobs
    profiles: [accounting]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/accounting:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    depends_on:
      accounting: { condition: service_started }
    environment: *accounting-env
    command: ["1d:report-schedules-tick", "1d:anomaly-scan"]

  activities:
    <<: *service
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/activities:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &activities-env
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dactivities,public"

  # Reminders and due activities, every 5 minutes.
  activities-jobs:
    <<: *jobs
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/activities:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    depends_on:
      activities: { condition: service_started }
    environment: *activities-env
    command: ["5m:tick"]

  notifications:
    <<: *service
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/notifications:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment:
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dnotifications,public"

  documents:
    <<: *service
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/documents:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &documents-env
      <<: *env
      HTTP_REQUEST_TIMEOUT_SECS: ${HTTP_LONG_REQUEST_TIMEOUT_SECS:-300}
      # The document editor (service `onlyoffice`, add-on of the same name; the
      # installer fills these while it is on). Empty = no editor: Documents
      # then hides New and Edit. The browser loads the editor from the public
      # address (<address>/onlyoffice, the gateway); the editor reaches this
      # service, and the blank-file templates are read, inside Docker.
      ONLYOFFICE_DOC_SERVER_URL: ${TARLEAKS_ONLYOFFICE_URL:+${ONLYOFFICE_PUBLIC_URL:-${TARLEAKS_ONLYOFFICE_URL:-}}}
      # Also where a saved document is downloaded from (1.2.0 and later).
      ONLYOFFICE_INTERNAL_URL: ${TARLEAKS_ONLYOFFICE_URL:+http://onlyoffice}
      DMS_ONLYOFFICE_CALLBACK_PUBLIC_URL: http://documents:8009
      # Contracts calls documents and the PDF tools on their internal routes
      # (no sign-in); all three must hold the same value.
      INTERNAL_API_TOKEN_SECRET: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is not set - run ./install.sh}
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Ddocuments,public"

  # Search index hourly; retention rules and "expiring soon" notices daily.
  documents-jobs:
    <<: *jobs
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/documents:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    depends_on:
      documents: { condition: service_started }
    environment: *documents-env
    command: ["1h:reindex", "1d:retention-sweep", "1d:expiring-scan"]

  reports:
    <<: *service
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/reports:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &reports-env
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dreports,public"

  # Scheduled reports, checked every minute.
  reports-jobs:
    <<: *jobs
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/reports:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    depends_on:
      reports: { condition: service_started }
    environment: *reports-env
    command: ["1m:schedule-tick"]

  parties:
    <<: *service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq-init: { condition: service_completed_successfully }
      parties-migrate: { condition: service_completed_successfully }
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/parties:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &parties-env
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dparties,public"

  # Applies parties's database updates to the platform database, then exits; the
  # service starts after it. Release 1.0.0 skips this at start, so saving a
  # customer, quote or order answered 500 although it was saved (and a retry
  # saved it twice). Production runs the same step before the service.
  parties-migrate:
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/parties:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    restart: "no"
    logging: *logging
    depends_on:
      postgres-prepare: { condition: service_completed_successfully }
    entrypoint: ["/app/service", "migrate"]
    environment: *parties-env

  crm:
    <<: *service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq-init: { condition: service_completed_successfully }
      crm-migrate: { condition: service_completed_successfully }
    profiles: [crm]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/crm:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &crm-env
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dcrm,public"

  # Applies crm's database updates to the platform database, then exits; the
  # service starts after it. Release 1.0.0 skips this at start, so saving a
  # customer, quote or order answered 500 although it was saved (and a retry
  # saved it twice). Production runs the same step before the service.
  crm-migrate:
    profiles: [crm]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/crm:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    restart: "no"
    logging: *logging
    depends_on:
      postgres-prepare: { condition: service_completed_successfully }
    entrypoint: ["/app/service", "migrate"]
    environment: *crm-env

  inventory:
    <<: *service
    profiles: [inventory]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/inventory:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment:
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dinventory,public"

  sales_orders:
    <<: *service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq-init: { condition: service_completed_successfully }
      sales_orders-migrate: { condition: service_completed_successfully }
    profiles: [sales_orders]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/sales_orders:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &sales-orders-env
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dsales_orders,public"

  # Applies sales_orders's database updates to the platform database, then exits; the
  # service starts after it. Release 1.0.0 skips this at start, so saving a
  # customer, quote or order answered 500 although it was saved (and a retry
  # saved it twice). Production runs the same step before the service.
  sales_orders-migrate:
    profiles: [sales_orders]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/sales_orders:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    restart: "no"
    logging: *logging
    depends_on:
      postgres-prepare: { condition: service_completed_successfully }
    entrypoint: ["/app/service", "migrate"]
    environment: *sales-orders-env

  chat:
    <<: *service
    profiles: [chat]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/chat:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment:
      <<: *env
      HTTP_REQUEST_TIMEOUT_SECS: ${HTTP_LONG_REQUEST_TIMEOUT_SECS:-300}
      # Voice and video calls need your own LiveKit server; all empty = calls
      # are off. docs/configuration.md#calls-livekit
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dchat,public"

  # ---------------------------------------------------------------------------
  # Tarleaks ERP — standard profile (8 GB RAM)
  # ---------------------------------------------------------------------------
  project_management:
    <<: *service
    profiles: [project_management]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/project_management:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &project-management-env
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dproject_management,public"

  # Scheduled automations every minute; risk and unassigned-work checks daily; retention monthly.
  project_management-jobs:
    <<: *jobs
    profiles: [project_management]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/project_management:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    depends_on:
      project_management: { condition: service_started }
    environment: *project-management-env
    command: ["1m:cron-tick", "1d:risk-sweep", "1d:stale-assignee-sweep", "30d:retention-sweep"]

  lms:
    <<: *service
    profiles: [lms]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/lms:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment:
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dlms,public"

  gamification:
    <<: *service
    profiles: [gamification]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/gamification:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment:
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dgamification,public"

  assets:
    <<: *service
    profiles: [assets]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/assets:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment:
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dassets,public"

  helpdesk:
    <<: *service
    profiles: [helpdesk]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/helpdesk:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &helpdesk-env
      <<: *env
      HTTP_REQUEST_TIMEOUT_SECS: ${HTTP_LONG_REQUEST_TIMEOUT_SECS:-300}
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dhelpdesk,public"

  # Ticket response and resolution deadlines (SLA), every 5 minutes.
  helpdesk-jobs:
    <<: *jobs
    profiles: [helpdesk]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/helpdesk:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    depends_on:
      helpdesk: { condition: service_started }
    environment: *helpdesk-env
    command: ["5m:sla-tick"]

  fleet:
    <<: *service
    profiles: [fleet]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/fleet:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &fleet-env
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dfleet,public"

  # Licence, insurance and registration expiry alerts, daily.
  fleet-jobs:
    <<: *jobs
    profiles: [fleet]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/fleet:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    depends_on:
      fleet: { condition: service_started }
    environment: *fleet-env
    command: ["1d:sweep-expiry"]

  correspondence:
    <<: *service
    profiles: [correspondence]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/correspondence:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &correspondence-env
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dcorrespondence,public"

  # Reply deadlines and delegations hourly; retention and the import gate daily.
  correspondence-jobs:
    <<: *jobs
    profiles: [correspondence]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/correspondence:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    depends_on:
      correspondence: { condition: service_started }
    environment: *correspondence-env
    command: ["1h:sla-sweep", "1h:delegation-sweep", "1d:retention-sweep", "1d:import-gate-sweep"]

  insights:
    <<: *service
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/insights:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &insights-env
      <<: *env
      HTTP_REQUEST_TIMEOUT_SECS: ${HTTP_LONG_REQUEST_TIMEOUT_SECS:-300}
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dinsights,public"

  # Scheduled dashboards every minute; the data catalogue scan hourly, so a new
  # workspace has its reports and dashboards within the hour (restart
  # insights-jobs to scan two minutes from now).
  insights-jobs:
    <<: *jobs
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/insights:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    depends_on:
      insights: { condition: service_started }
    environment: *insights-env
    command: ["1m:schedule-tick", "1h:scan"]

  ecommerce:
    <<: *service
    profiles: [ecommerce]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/ecommerce:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment:
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Decommerce,public"

  pos:
    <<: *service
    profiles: [pos]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/pos:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment:
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dpos,public"

  rental:
    <<: *service
    profiles: [rental]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/rental:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &rental-env
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Drental,public"

  # Overdue rentals, every 15 minutes.
  rental-jobs:
    <<: *jobs
    profiles: [rental]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/rental:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    depends_on:
      rental: { condition: service_started }
    environment: *rental-env
    command: ["15m:overdue-tick"]

  procurement:
    <<: *service
    profiles: [procurement]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/procurement:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment:
      <<: *env
      # Seals supplier bids until the opening. Never change it: sealed bids of
      # RFQs not yet opened cannot be opened without it. Keep a copy of .env.
      PROCUREMENT_KEK: ${PROCUREMENT_KEK:?PROCUREMENT_KEK is not set - run ./install.sh}
      PROCUREMENT_KEK_VERSION: ${PROCUREMENT_KEK_VERSION:-v1}
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dprocurement,public"

  construction:
    <<: *service
    profiles: [construction]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/construction:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment:
      <<: *env
      # The document editor's server, inside Docker, which turns a payment
      # certificate into a PDF. Empty when the editors are off: the app then
      # says to print from the browser instead.
      ONLYOFFICE_URL: ${TARLEAKS_ONLYOFFICE_URL:+http://onlyoffice}
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dconstruction,public"

  contracts:
    <<: *service
    profiles: [contracts]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/contracts:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment:
      <<: *env
      # The document editor's server, inside Docker, which makes the PDF of a
      # contract drafted from a template and the signing record. Empty when the
      # editors are off: upload the contract's PDF yourself then.
      ONLYOFFICE_URL: ${TARLEAKS_ONLYOFFICE_URL:+http://onlyoffice}
      # Seals the identity-provider (UAE PASS, Nafath) secrets saved in a
      # workspace. Never change it: saved provider secrets cannot be read without
      # it. Keep a copy of .env. Empty is allowed; saving such a secret then
      # fails with a clear message.
      CONTRACTS_PROVIDER_KEY: "${CONTRACTS_PROVIDER_KEY:-}"
      # Contracts calls documents and the PDF tools on their internal routes
      # (no sign-in); all three must hold the same value.
      INTERNAL_API_TOKEN_SECRET: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is not set - run ./install.sh}
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dcontracts,public"

  subscriptions:
    <<: *service
    profiles: [subscriptions]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/subscriptions:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment: &subscriptions-env
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dsubscriptions,public"

  # Recurring invoices, renewals and trial ends, and reminders for unpaid invoices, hourly.
  subscriptions-jobs:
    <<: *jobs
    profiles: [subscriptions]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/subscriptions:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    depends_on:
      subscriptions: { condition: service_started }
    environment: *subscriptions-env
    command: ["1h:billing-tick", "1h:dunning-tick"]

  # ---------------------------------------------------------------------------
  # Tarleaks ERP — full profile (16 GB RAM)
  # ---------------------------------------------------------------------------
  pdftools:
    <<: *service
    # OCR of large scans needs more than the other services.
    mem_limit: ${PDFTOOLS_MEM_LIMIT:-2g}
    profiles: [pdftools]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/pdftools:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment:
      <<: *env
      HTTP_REQUEST_TIMEOUT_SECS: ${HTTP_LONG_REQUEST_TIMEOUT_SECS:-300}
      # Contracts calls documents and the PDF tools on their internal routes
      # (no sign-in); all three must hold the same value.
      INTERNAL_API_TOKEN_SECRET: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is not set - run ./install.sh}
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dpdftools,public"

  diagrams:
    <<: *service
    profiles: [diagrams]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/diagrams:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment:
      <<: *env
      HTTP_REQUEST_TIMEOUT_SECS: ${HTTP_LONG_REQUEST_TIMEOUT_SECS:-300}
      # The engine behind AI drawing (service `diagrams-engine`, an add-on).
      # Empty = this installation has no AI drawing: the Diagrams app says so
      # instead of offering it.
      DIAGRAMS_ENGINE_URL: ${TARLEAKS_DIAGRAMS_ENGINE_URL:-}
      # Where the app embeds the diagram editor from (the `drawio` add-on at
      # <address>/drawio/). Empty = this installation has no diagram editor, and
      # the app says so instead of loading one from the internet. The service
      # hands this address to the page (GET /api/diagrams/capabilities).
      DRAWIO_URL: ${TARLEAKS_DRAWIO_URL:+${DRAWIO_URL:-${TARLEAKS_DRAWIO_URL:-}}}
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Ddiagrams,public"

  imtithal:
    <<: *service
    profiles: [imtithal]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/imtithal:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment:
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dimtithal,public"

  iso42001:
    <<: *service
    profiles: [iso42001]
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/iso42001:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    environment:
      <<: *env
      DATABASE_URL: "postgres://${POSTGRES_USER:-tarleaks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tarleaks}?options=-csearch_path%3Dimtithal,public"

  # ---------------------------------------------------------------------------
  # Editors: add-ons that run next to the apps that use them (rows of kind
  # `addon` in config/apps.tsv). The installer adds them to COMPOSE_PROFILES;
  # ./tarleaks editors off switches them all off (docs/configuration.md#editors).
  # ---------------------------------------------------------------------------

  # The document editor: ONLYOFFICE Document Server (AGPL-3.0), the same one
  # the hosted service runs (the release's own `onlyoffice` image: Document
  # Server 9.4.0.1 plus about 100 Arabic fonts), so New, Edit, co-editing and
  # versions in Documents (and the letter templates in HR) work here as they
  # do online. Which image: ONLYOFFICE_IMAGE (yours) wins; else
  # TARLEAKS_ONLYOFFICE_IMAGE (written by the installer for a release older
  # than 1.2.0, which has no such image: it gets the stock Document Server);
  # else the release's image.
  # Browsers open it at <address>/onlyoffice/ through `onlyoffice-proxy`.
  # It keeps only editing sessions and caches (the documents themselves are in
  # the file store), which is why its volumes are not in the backup.
  onlyoffice:
    image: ${ONLYOFFICE_IMAGE:-${TARLEAKS_ONLYOFFICE_IMAGE:-${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/onlyoffice:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}}}
    profiles: [onlyoffice]
    restart: unless-stopped
    logging: *logging
    # One more than the others: Java, Node and a headless browser in one image.
    mem_limit: ${ONLYOFFICE_MEM_LIMIT:-3g}
    environment:
      # The same secret Documents and HR sign and check editor tokens with
      # (generated once by the installer; never changed by a script).
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET is not set - run ./install.sh}
      # The editor fetches and saves files from Documents and HR at their
      # addresses inside Docker, which are private addresses.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-lib:/var/lib/onlyoffice
      - onlyoffice-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1/healthcheck | grep -q true"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  # Puts the document editor at <address>/onlyoffice/ on the one address the
  # ERP already has, and tells it so (it builds its links from the forwarded
  # address). config/onlyoffice/proxy.conf.template.
  onlyoffice-proxy:
    image: ${AUTHPROXY_IMAGE:-nginx:1.30.6-alpine}
    profiles: [onlyoffice]
    restart: unless-stopped
    logging: *logging
    mem_limit: ${AUTHPROXY_MEM_LIMIT:-128m}
    environment:
      # Which scheme the browser used (http or https behind your own proxy).
      TARLEAKS_URL: ${TARLEAKS_URL:-http://localhost}
      NGINX_ENVSUBST_FILTER: ^TARLEAKS_
    volumes:
      - ./config/onlyoffice/proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/proxy-health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # The diagram editor: draw.io (jgraph/drawio, Apache-2.0), served by the
  # gateway at <address>/drawio/. The Diagrams app draws in it. It is a set of
  # static pages: it keeps no data. Cloud storage, server-side export and every
  # outside address are switched off (docs/configuration.md#editors).
  drawio:
    image: ${DRAWIO_IMAGE:-jgraph/drawio:31.4.6}
    profiles: [drawio]
    restart: unless-stopped
    mem_limit: ${DRAWIO_MEM_LIMIT:-1g}
    logging: *logging
    environment:
      # Its own public address. The path must be /drawio/: the gateway sends
      # only that path here.
      DRAWIO_SERVER_URL: ${DRAWIO_URL:-${TARLEAKS_DRAWIO_URL:-${TARLEAKS_URL:-http://localhost}/drawio/}}
      # The editor may load only its own files (the image's default also
      # allows Google, Dropbox, GitHub and OneDrive). Written into a
      # JavaScript string by the image, hence the \' quotes.
      DRAWIO_CSP_HEADER: >-
        default-src \'self\'; script-src \'self\' \'unsafe-inline\';
        connect-src \'self\'; img-src \'self\' data: blob:;
        media-src \'self\' data:; font-src \'self\' data: about:;
        style-src \'self\' \'unsafe-inline\'; frame-src \'self\';
        worker-src \'self\' blob:

  # The engine behind AI drawing in the Diagrams app (from release 1.2.0).
  # Stateless: it keeps no data, and holds a company's AI key only while it
  # answers one request. Which AI provider and model a company uses is set by
  # that company (Settings, AI); GROQ_API_KEY / DIAGRAMS_MODEL_ID in .env are
  # only the fallback for a company that has set none.
  diagrams-engine:
    image: ${TARLEAKS_REGISTRY:-registry.tarleaks.com/tarleaks-erp}/diagrams-engine:${TARLEAKS_VERSION:?TARLEAKS_VERSION is not set}
    profiles: [diagrams-engine]
    restart: unless-stopped
    logging: *logging
    mem_limit: ${DIAGRAMS_ENGINE_MEM_LIMIT:-512m}
    environment:
      REQUEST_TIMEOUT_SECS: ${HTTP_LONG_REQUEST_TIMEOUT_SECS:-300}
      MODEL_ID: ${DIAGRAMS_MODEL_ID:-}
      OPENAI_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_BASE_URL: ${DIAGRAMS_AI_BASE_URL:-https://api.groq.com/openai/v1}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: *no_proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8023/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  files:
  hrdocs:
  # The document editor's sessions and caches (add-on `onlyoffice`).
  onlyoffice-data:
  onlyoffice-lib:
  onlyoffice-db:
