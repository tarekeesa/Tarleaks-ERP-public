# Tarleaks ERP behind an existing nginx.
#
# Put this file in /etc/nginx/conf.d/ (or sites-available/ and link it into
# sites-enabled/), replace erp.example.com with your domain everywhere, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The ERP's gateway listens only on this machine: .env has HTTP_BIND=127.0.0.1
# and HTTP_PORT=8080 (see address.env). If port 8080 is taken on this host, pick
# another in .env and change both proxy_pass lines below to match.

# Lets a WebSocket upgrade through on one path, and plain requests everywhere else.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.example.com;

    # Certificate checks (certbot --webroot) are answered here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25.1 or newer: add "http2 on;" here for HTTP/2.
    server_name erp.example.com;

    ssl_certificate     /etc/letsencrypt/live/erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Uploads: the biggest file people may send. Raise it if you need more.
    client_max_body_size 100m;

    # Live chat: WebSocket upgrade.
    # A location that sets its own proxy_set_header lines does NOT inherit the
    # ones from the server block, so every header is repeated here.
    location = /api/chat/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        # If chat disconnects when nobody types for a while, raise this one.
        proxy_read_timeout    300s;
    }

    # Everything else: the ERP and the file store at /<bucket>/.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # The Host header MUST reach the gateway unchanged. Signed upload links
        # are checked against it, and uploads fail with "SignatureDoesNotMatch"
        # if it is rewritten.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
